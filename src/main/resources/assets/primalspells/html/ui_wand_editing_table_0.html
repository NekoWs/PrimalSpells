<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>法杖编辑台</title>
<style>
.demo-title { color: #ffffff; }
.demo-title:hover { color: #ffaa00; }
.demo-label { color: #55aaff; }
.demo-label:hover { color: #ff5555; }
.demo-label.highlight { color: #55ff55; }
.demo-btn { background: #2b2b30; color: #c8c8c8; }
.demo-btn:hover { background: #5a5a63; color: #ffffff; }
.demo-panel { background: #26262b; border-color: #3d3d42; }
.demo-progress { background: #22222a; }
.demo-progress:hover { color: #7fff7f; }
</style>
</head>
<body>
<div style="width:auto;height:auto;background:#1a1a1e;border-color:#4a4a55;display:flex;flex-direction:column;gap:4;padding:6" title="法杖编辑台">
    <h2 class="demo-title" style="text-align:center">法杖法术编辑（新特性测试）</h2>
    <hr style="color:#3d3d42"/>

    <div class="demo-panel" style="width:auto;height:auto;display:flex;flex-direction:column;gap:4;padding:4">
        <label style="color:gray">CSS 类与 :hover（悬停看变色）：</label>
        <label class="demo-label">悬停我变红</label>
        <label class="demo-label highlight">多类叠加：class="demo-label highlight"</label>
        <label style="color:#aa55ff">无 class：内联样式（紫）</label>
    </div>

    <div class="demo-panel" style="width:auto;height:auto;display:flex;flex-direction:row;gap:4;padding:4;align-items:center">
        <label style="color:gray">按钮：</label>
        <button class="demo-btn" style="width:80;height:20" onclick="test">测试</button>
        <button class="demo-btn" style="width:80;height:20" onclick="close">关闭</button>
    </div>

    <div class="demo-panel" style="width:auto;height:auto;display:flex;flex-direction:column;gap:4;padding:4">
        <label style="color:gray">进度条（勾选下方选项启动动画 / 悬停变绿）：</label>
        <progress id="p1" value="75" max="100" class="demo-progress" style="color:#33ccff"/>
        <progress id="p2" value="40" max="100" class="demo-progress" style="color:#ffaa00"/>
    </div>

    <div style="width:auto;height:auto;display:flex;flex-direction:row;gap:8;align-items:center">
        <checkbox checked="true" target="p1">自动施放</checkbox>
        <checkbox target="p2">强力</checkbox>
    </div>

    <hr style="color:#3d3d42"/>
    <label style="color:gray">· transition / animation / calc 等尚未实现（见 TODO）</label>
</div>
</body>
</html>
