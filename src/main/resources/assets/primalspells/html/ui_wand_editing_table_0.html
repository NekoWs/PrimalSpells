<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>法杖编辑台</title>
</head>
<body>
<div style="width:230;height:auto;background:#1a1a1e;border-color:#4a4a55;display:flex;flex-direction:column;gap:4;padding:6" title="法杖编辑台">
    <h2 style="text-align:center;color:#ffffff">法杖法术编辑</h2>
    <hr style="color:#3d3d42"/>

    <div style="width:auto;height:auto;background:#26262b;border-color:#3d3d42;display:flex;flex-direction:row;gap:4;padding:4;align-items:center">
        <label style="color:gray">槽位：</label>
        <slot src="primalspells:wand"/>
        <slot src="primalspells:fireball" count="3"/>
        <slot/>
        <slot/>
    </div>

    <div style="width:auto;height:auto;background:#26262b;border-color:#3d3d42;display:flex;flex-direction:column;gap:4;padding:4">
        <label style="color:gray;font-size:12">状态：</label>
        <progress value="75" max="100" style="color:#33ccff;background:#22222a"/>
        <progress value="40" max="100" style="color:#ffaa00;background:#22222a"/>
    </div>

    <div style="width:auto;height:auto;display:flex;flex-direction:row;gap:8;align-items:center">
        <checkbox checked="true">自动施放</checkbox>
        <checkbox>强力</checkbox>
    </div>

    <hr style="color:#3d3d42"/>
    <div style="width:auto;height:auto;display:flex;flex-direction:row;gap:4">
        <button style="width:98;height:20;hover-background:#5a5a63" onclick="test">测试</button>
        <button style="width:98;height:20" onclick="close">关闭</button>
    </div>
</div>
</body>
</html>
