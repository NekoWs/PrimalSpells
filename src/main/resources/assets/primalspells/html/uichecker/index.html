<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>PrimalSpells UI Checker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: #101014; color: #ddd; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: #1c1c22; border-bottom: 1px solid #33333b; flex: none;
}
.btn {
  display: inline-block; padding: 6px 14px; background: #2b2b30; border: 1px solid #4e4e55;
  border-radius: 3px; color: #ddd; cursor: pointer; font-size: 13px; user-select: none;
}
.btn:hover { background: #404046; }
.btn.primary { background: #2f4f6f; border-color: #3f6f9f; }
.btn.primary:hover { background: #3a5f8f; }
.btn:disabled { opacity: .45; cursor: default; }
.file-name { font-size: 12px; color: #888; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zoom-row { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
#stage {
  flex: 1; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center;
  background-image: radial-gradient(circle, #1a1a1f 1px, transparent 1px); background-size: 20px 20px;
}
.hint { color: #555; font-size: 14px; text-align: center; padding: 20px; }
#viewport { padding: 30px; }
#mcUi { transform-origin: center; }
.error-msg { color: #ff6b6b; font-size: 13px; padding: 12px; background: #2a1515; border: 1px solid #5a2a2a; max-width: 70vw; }
#stage.dragging::after {
  content: '\677e\u5f00\u4ee5\u52a0\u8f7d HTML \u6587\u4ef6';
  position: fixed; inset: 0; background: rgba(40, 70, 110, .4); z-index: 9;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff; letter-spacing: 2px; pointer-events: none;
}

/* ---------- MC UI 模拟 ---------- */
.mc-window { background: #1a1a1e; border: 1px solid #4e4e5a; box-shadow: 0 6px 28px rgba(0,0,0,.55); }
.mc-titlebar { height: 16px; background: #2a2a32; border-bottom: 1px solid #555560; color: #fff; font-size: 9px; line-height: 15px; padding: 0 8px; white-space: nowrap; display: flex; justify-content: space-between; }
.mc-dots { color: #b0b0b8; }
.mc-content { position: relative; }

.mc-panel { background: #1a1a1e; border: 1px solid #3d3d42; position: relative; overflow: hidden; }
.mc-panel-title { position: absolute; left: 8px; top: 5px; color: #ffffff; font-size: 9px; line-height: 9px; white-space: nowrap; }
.mc-label { color: #e0e0e0; font-size: 9px; line-height: 9px; white-space: nowrap; }
.mc-button {
  background: #2b2b30; border: 1px solid #4e4e55; color: #c8c8c8; font-size: 9px;
  display: flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 9px; padding: 0 4px;
}
.mc-button:hover { background: #404046; color: #fff; }
.mc-button.disabled { opacity: .5; }
.mc-slot {
  border: 1px solid #4e4e5a; background: rgba(255,255,255,.03); position: relative;
  display: flex; align-items: center; justify-content: center; font-size: 8px; color: #aaa; overflow: hidden;
}
.mc-slot:hover { border-color: #8fc9ff; }
.mc-slot .ico { width: 10px; height: 10px; flex: none; border-radius: 1px; }
.mc-slot .count { position: absolute; right: 1px; bottom: 0; color: #fff; font-size: 7px; text-shadow: 1px 1px #000; line-height: 8px; }
.mc-progress { background: #2a2a32; overflow: hidden; }
.mc-progress > i { display: block; height: 100%; background: #3399ff; }
.mc-progress.animated > i { animation: mc-progress-flow 1s ease-in-out infinite alternate; }
@keyframes mc-progress-flow { from { width: 0%; } to { width: 100%; } }
.mc-checkbox { display: flex; align-items: center; gap: 4px; font-size: 9px; white-space: nowrap; color: #e0e0e0; cursor: pointer; }
.mc-checkbox .box { width: 9px; height: 9px; border: 1px solid #4e4e55; background: #2b2b30; flex: none; line-height: 8px; text-align: center; }
.mc-checkbox.on .box { background: #2f6f3f; border-color: #3f7f4f; color: #7fff7f; font-size: 8px; }
.mc-hr { background: #4a4a55; }
.mc-img { background: #26262b; border: 1px solid #3d3d42; display: flex; align-items: center; justify-content: center; color: #666; font-size: 8px; overflow: hidden; padding: 0 2px; white-space: nowrap; }
.mc-gridph { border: 1px dashed #4a4a55; background: rgba(74,74,85,.15); display: flex; align-items: center; justify-content: center; color: #6a6a75; font-size: 8px; }
.mc-placeholder { border: 1px dashed #5a4a4a; color: #a07070; font-size: 8px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<header>
  <label class="btn">选择 HTML 文件<input type="file" id="fileInput" accept=".html,.htm,text/html" style="display:none"/></label>
  <span class="file-name" id="fileName">未选择文件</span>
  <button class="btn primary" id="checkBtn" disabled>开始检查</button>
  <span class="zoom-row">缩放 <input type="range" id="zoom" min="40" max="200" value="100"/>
    <span id="zoomVal">100%</span></span>
</header>
<main id="stage">
  <div id="hint" class="hint">选择 HTML 文件后点击「开始检查」<br/>页面中心将显示该 UI 在游戏内的效果</div>
  <div id="viewport" style="display:none"><div id="mcUi"></div></div>
</main>
<script>
'use strict';
// ================= 极简 HTML 解析器（与游戏 HtmlUiParser 一致） =================
function parseHtml(src) {
  const roots = [], stack = [];
  let i = 0;
  while (i < src.length) {
    const lt = src.indexOf('<', i);
    if (lt === -1) { if (stack.length) stack[stack.length - 1].text += src.slice(i); break; }
    if (stack.length) stack[stack.length - 1].text += src.slice(i, lt);
    const gt = src.indexOf('>', lt);
    if (gt === -1) break;
    const content = src.slice(lt + 1, gt).trim();
    i = gt + 1;
    if (content.startsWith('!') || content.startsWith('?')) continue;
    if (content.startsWith('/')) {
      const name = content.slice(1).trim();
      if (stack.length && stack[stack.length - 1].tag === name) {
        const closed = stack.pop();
        (stack.length ? stack[stack.length - 1].children : roots).push(closed);
      }
      continue;
    }
    if (content.endsWith('/')) {
      const [name, attrs] = splitTag(content.slice(0, -1));
      const node = { tag: name, attrs, children: [], text: '' };
      (stack.length ? stack[stack.length - 1].children : roots).push(node);
      continue;
    }
    const [name, attrs] = splitTag(content);
    if (name) stack.push({ tag: name, attrs, children: [], text: '' });
  }
  while (stack.length) roots.push(stack.pop());
  return roots;
}
function splitTag(content) {
  const sp = content.search(/\s/);
  const name = sp === -1 ? content : content.slice(0, sp);
  const attrs = {};
  const rest = sp === -1 ? '' : content.slice(sp + 1);
  const re = /([\w-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;
  let m;
  while ((m = re.exec(rest))) attrs[m[1]] = m[2] !== undefined ? m[2] : m[3];
  return [name, attrs];
}
function parseStyle(s) {
  const map = {};
  (s || '').split(';').forEach(kv => {
    const idx = kv.indexOf(':');
    if (idx > 0) map[kv.slice(0, idx).trim()] = kv.slice(idx + 1).trim();
  });
  return map;
}
// 尺寸：px / % / auto
function dim(style, key, parent) {
  const v = style[key];
  if (v == null) return null;
  const t = v.trim();
  if (t === 'auto') return 'auto';
  if (t.endsWith('%')) return parent * parseFloat(t) / 100;
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
// 颜色：命名色 / #hex / rgb() / rgba()
const NAMED = { white:'#ffffff', black:'#000000', gray:'#808080', lightgray:'#c0c0c0', darkgray:'#404040',
  red:'#ff5555', green:'#55ff55', blue:'#5555ff', yellow:'#ffff55', orange:'#ffaa00', purple:'#aa55ff',
  cyan:'#55ffff', transparent:'transparent' };
function colorOf(style, key, fallback) {
  let t = (style[key] || '').trim().toLowerCase();
  if (!t) return fallback;
  if (NAMED[t]) return NAMED[t];
  if (t.startsWith('#')) return t;
  if (t.startsWith('rgb')) {
    const inner = t.slice(t.indexOf('(') + 1, t.lastIndexOf(')'));
    const parts = inner.split(',').map(x => x.trim());
    if (parts.length >= 3) {
      let a = 1;
      if (parts[3] !== undefined) {
        if (parts[3].endsWith('%')) a = parseFloat(parts[3]) / 100;
        else a = parseFloat(parts[3]) <= 1 ? parseFloat(parts[3]) : parseFloat(parts[3]) / 255;
      }
      return 'rgba(' + parts.slice(0, 3).join(',') + ',' + a + ')';
    }
  }
  return fallback;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function findFirstDiv(node) {
  if (node.tag === 'div') return node;
  for (const c of node.children) { const r = findFirstDiv(c); if (r) return r; }
  return null;
}
// 收集所有 <style> 节点内容
function collectStyles(roots) {
  const out = [];
  (function walk(nodes) {
    for (const n of nodes) {
      if (n.tag === 'style') out.push(n.text);
      walk(n.children);
    }
  })(roots);
  return out;
}
// 每条声明追加 !important（覆盖内联样式，匹配游戏内"类规则优先于内联"的语义）
function forceImportant(css) {
  return css.replace(/([\w-]+\s*:\s*[^;{}]+);/g, '$1 !important;');
}
// 元素 class 属性 → DOM class
function clsOf(node) {
  const c = node.attrs.class;
  return c ? ' ' + c.split(/\s+/).filter(Boolean).join(' ') : '';
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
// 物品名称 → 固定色块
function itemColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ', 55%, 45%)';
}

// ================= 布局引擎（与游戏 HtmlUiParser 逻辑一致：估算尺寸 + 绝对定位） =================
const DEF_FONT = 9; // MC 默认字号 9px

function fontWidthOf(text) {
  // 近似 MC 字体宽度：ASCII 5px，CJK 9px（像素）
  let w = 0;
  for (const ch of text) {
    const c = ch.codePointAt(0);
    w += (c < 0x80) ? 5 : 9;
  }
  return w;
}
function fontSizeOf(node, style) {
  if (style['font-size']) {
    const v = parseFloat(style['font-size']);
    if (!isNaN(v) && v > 0) return v;
  }
  switch (node.tag) {
    case 'h1': return DEF_FONT * 2;
    case 'h2': return DEF_FONT * 1.5;
    case 'h3': return DEF_FONT * 1.2;
  }
  return DEF_FONT;
}
function flexDirOf(style) {
  return style.display === 'flex' ? (style['flex-direction'] === 'row' ? 'row' : 'column') : null;
}
function hasPos(style, parentW, parentH) {
  return dim(style, 'left', parentW) != null || dim(style, 'top', parentH) != null;
}

// 未声明宽度时的估算宽度（div 由布局递归计算，返回 0 表示占满/内容自适应）
function estimateWidth(node, parentW) {
  const style = parseStyle(node.attrs.style);
  const w = dim(style, 'width', parentW);
  if (w !== null && w !== 'auto') return w;
  switch (node.tag) {
    case 'label': case 'span': case 'p': case 'h1': case 'h2': case 'h3':
      return Math.round(fontWidthOf(node.text) * fontSizeOf(node, style) / DEF_FONT);
    case 'checkbox': return fontWidthOf(node.text) + 16;
    case 'slot': return 18;
    case 'button': case 'a': return 60;
    case 'img': { const v = dim(style, 'width', parentW); return (v !== null && v !== 'auto') ? v : 24; }
    case 'spell-grid': { const v = dim(style, 'width', parentW); return (v !== null && v !== 'auto') ? v : 160; }
    case 'progress': case 'hr': case 'div': return 0; // 占满/内容自适应
    default: return 18;
  }
}

// 未声明高度时的估算高度（div 递归内容高度，与渲染结果一致）
function estimateHeight(node, parentW, parentH) {
  const style = parseStyle(node.attrs.style);
  const h = dim(style, 'height', parentH);
  if (h !== null && h !== 'auto') return h;
  switch (node.tag) {
    case 'label': case 'span': case 'p': case 'h1': case 'h2': case 'h3': return Math.round(fontSizeOf(node, style));
    case 'slot': return 18;
    case 'button': case 'a': return 20;
    case 'checkbox': return 12;
    case 'progress': return 4;
    case 'hr': return 1;
    case 'img': { const v = dim(style, 'height', parentH); return (v !== null && v !== 'auto') ? v : 24; }
    case 'spell-grid': { const v = dim(style, 'height', parentH); return (v !== null && v !== 'auto') ? v : 40; }
    case 'div': {
      const flexDir = flexDirOf(style);
      const padding = dim(style, 'padding', parentW) || 0;
      let inner = 0;
      if (flexDir) {
        const gap = dim(style, 'gap', parentW) || 2;
        if (flexDir === 'column') {
          const autos = node.children.filter(c => !hasPos(parseStyle(c.attrs.style), parentW, parentH));
          inner = autos.reduce((s, c) => s + estimateHeight(c, parentW, parentH), 0)
            + gap * Math.max(0, autos.length - 1);
        } else {
          inner = node.children.reduce((m, c) => Math.max(m, estimateHeight(c, parentW, parentH)), 0);
        }
      } else {
        inner = node.children.reduce((m, c) => {
          const cs = parseStyle(c.attrs.style);
          return Math.max(m, (dim(cs, 'top', parentH) || 0) + estimateHeight(c, parentW, parentH));
        }, 0);
      }
      return inner + padding * 2;
    }
    default: return 18;
  }
}

// 创建元素并设置视觉样式（不含定位与尺寸）
function buildNode(node, isWindowRoot) {
  const style = parseStyle(node.attrs.style);
  const cls = clsOf(node);
  let e = null;
  switch (node.tag) {
    case 'div': {
      e = el('div', 'mc-panel' + cls);
      e.style.background = colorOf(style, 'background', '#1a1a1e');
      e.style.borderColor = colorOf(style, 'border-color', '#3d3d42');
      const bgImg = style['background-image'];
      if (bgImg) e.style.backgroundImage = 'url("' + esc(bgImg.replace(/^url\(|\)$/g, '')) + '")';
      // 窗口根 div 的 title 只作为窗口标题（顶栏），不生成正文区面板标题（见 code_log #24）
      if (node.attrs.title && !isWindowRoot) {
        const t = el('div', 'mc-panel-title', node.attrs.title);
        e.appendChild(t);
      }
      break;
    }
    case 'img': {
      const src = node.attrs.src || '?';
      e = el('div', 'mc-img' + cls, src.split('/').pop());
      break;
    }
    case 'slot': {
      e = el('div', 'mc-slot' + cls);
      const src = node.attrs.src;
      if (src) {
        const ico = el('div', 'ico');
        ico.style.background = itemColor(src.split(':').pop());
        e.appendChild(ico);
        if (node.attrs.count && node.attrs.count !== '1') {
          e.appendChild(el('span', 'count', node.attrs.count));
        }
      }
      break;
    }
    case 'spell-grid': {
      e = el('div', 'mc-gridph' + cls, 'spell-grid');
      break;
    }
    case 'button': case 'a': {
      e = el('div', 'mc-button' + (node.attrs.enabled === 'false' ? ' disabled' : '') + cls, node.text.trim());
      e.style.fontSize = fontSizeOf(node, style) + 'px';
      e.style.color = colorOf(style, 'color', '#c8c8c8');
      e.style.background = colorOf(style, 'background', '#2b2b30');
      e.style.borderColor = colorOf(style, 'border-color', '#4e4e55');
      break;
    }
    case 'label': case 'span': case 'p': case 'h1': case 'h2': case 'h3': {
      e = el('div', 'mc-label' + cls, node.text.trim());
      const fs = fontSizeOf(node, style);
      e.style.fontSize = fs + 'px';
      e.style.lineHeight = fs + 'px';
      e.style.color = colorOf(style, 'color', '#e0e0e0');
      if (style['text-align'] === 'center') e.style.textAlign = 'center';
      if (style['text-align'] === 'right') e.style.textAlign = 'right';
      if (node.attrs.id) e.dataset.id = node.attrs.id;
      break;
    }
    case 'hr': {
      e = el('div', 'mc-hr' + cls);
      e.style.background = colorOf(style, 'color', colorOf(style, 'border-color', '#4a4a55'));
      break;
    }
    case 'progress': {
      e = el('div', 'mc-progress' + (node.attrs.animated === 'true' ? ' animated' : '') + cls);
      if (node.attrs.id) e.dataset.id = node.attrs.id;
      e.style.background = colorOf(style, 'background', '#2a2a32');
      const val = parseFloat(node.attrs.value) || 0;
      const max = parseFloat(node.attrs.max) || 100;
      const fill = el('i');
      fill.style.width = Math.max(0, Math.min(100, val / max * 100)) + '%';
      fill.style.background = colorOf(style, 'color', '#3399ff');
      e.appendChild(fill);
      break;
    }
    case 'checkbox': {
      e = el('div', 'mc-checkbox' + (node.attrs.checked === 'true' ? ' on' : '') + cls);
      const box = el('span', 'box');
      if (node.attrs.checked === 'true') box.textContent = '\u2713';
      e.appendChild(box);
      e.appendChild(el('span', null, node.text.trim()));
      // target 关联：勾选切换目标进度条动画（与游戏 checkbox target 一致）
      if (node.attrs.target) {
        e.dataset.target = node.attrs.target;
        e.style.cursor = 'pointer';
        e.addEventListener('click', () => {
          e.classList.toggle('on');
          e.querySelector('.box').textContent = e.classList.contains('on') ? '\u2713' : '';
          const target = document.querySelector('.mc-progress[data-id="' + e.dataset.target + '"]');
          if (target) target.classList.toggle('animated', e.classList.contains('on'));
        });
      }
      break;
    }
    default: {
      e = el('div', 'mc-placeholder' + cls, '<' + node.tag + '>');
      break;
    }
  }
  if (node.attrs.hidden !== undefined) e.style.display = 'none';
  return e;
}

/**
 * 递归布局：计算节点位置与尺寸并设置为绝对定位。
 * @param node 节点
 * @param parentEl 父 DOM（position:relative）
 * @param x y 相对父内容区（padding 盒内）的坐标
 * @param parentW parentH 父内容区尺寸（百分比解析用）
 * @return 布局后的 DOM 元素（style.width/height 已设置）
 */
function layoutNode(node, parentEl, x, y, parentW, parentH, isWindowRoot) {
  const style = parseStyle(node.attrs.style);
  const flexDir = flexDirOf(style);
  const e = buildNode(node, isWindowRoot);
  e.style.position = 'absolute';
  e.style.left = x + 'px';
  e.style.top = y + 'px';
  let w, h;

  if (flexDir) {
    const padding = dim(style, 'padding', parentW) || 0;
    const gap = dim(style, 'gap', parentW) || 2;
    const alignCenter = style['align-items'] === 'center';
    // 容器尺寸（auto 时按子元素估算；声明了尺寸的元素也计入，避免按钮等溢出）
    const declW = dim(style, 'width', parentW);
    const declH = dim(style, 'height', parentH);
    const naturalW = node.children.reduce((m, c) => Math.max(m, estimateWidth(c, parentW)), 0);
    const naturalH = node.children.reduce((m, c) => Math.max(m, estimateHeight(c, parentW, parentH)), 0);
    const containerW = (declW && declW !== 'auto') ? declW : Math.max(naturalW + padding * 2, 0);
    const containerH = (declH && declH !== 'auto') ? declH : Math.max(naturalH + padding * 2, 0);
    const crossW = Math.max(containerW - padding * 2, 0);
    const crossH = Math.max(containerH - padding * 2, 0);

    let cursorX = padding, cursorY = padding;
    for (const c of node.children) {
      const cs = parseStyle(c.attrs.style);
      const auto = !hasPos(cs, parentW, parentH);
      const cw0 = dim(cs, 'width', parentW);
      const ch0 = dim(cs, 'height', parentH);
      const cw = (cw0 && cw0 !== 'auto') ? cw0 : (estimateWidth(c, parentW) || (flexDir === 'column' ? crossW : 18));
      const ch = (ch0 && ch0 !== 'auto') ? ch0 : estimateHeight(c, parentW, parentH);
      const cx = !auto ? null : (flexDir === 'row' ? cursorX : (alignCenter ? padding + (crossW - cw) / 2 : padding));
      const cy = !auto ? null : (flexDir === 'column' ? cursorY : (alignCenter ? padding + (crossH - ch) / 2 : padding));
      const childEl = layoutNode(c, e,
        (cx != null ? cx : (dim(cs, 'left', parentW) || 0)),
        (cy != null ? cy : (dim(cs, 'top', parentH) || 0)),
        parentW, parentH);
      if (c.tag === 'div') {
        // div 面板尺寸由自身内容决定（与游戏一致：面板只包住内容，不强加 crossW 占满）
      } else {
        childEl.style.width = cw + 'px';
        childEl.style.height = ch + 'px';
      }
      if (flexDir === 'column') cursorY += ch + gap; else cursorX += cw + gap;
    }
    w = (declW && declW !== 'auto') ? declW : (flexDir === 'row' ? cursorX + padding : containerW);
    h = (declH && declH !== 'auto') ? declH : (flexDir === 'column' ? cursorY + padding : containerH);
  } else {
    // 绝对定位子元素
    for (const c of node.children) {
      const cs = parseStyle(c.attrs.style);
      layoutNode(c, e,
        dim(cs, 'left', parentW) || 0,
        dim(cs, 'top', parentH) || 0,
        parentW, parentH);
    }
    const dw = dim(style, 'width', parentW);
    const dh = dim(style, 'height', parentH);
    if (node.tag === 'progress' || node.tag === 'hr') {
      // 未声明宽度：占满父内容区（等价游戏内 parentW - left）
      w = (dw && dw !== 'auto') ? dw : Math.max(parentW - x, 0);
      h = (dh && dh !== 'auto') ? dh : (node.tag === 'hr' ? 1 : 4);
    } else {
      w = (dw && dw !== 'auto') ? dw : Math.max(Array.from(e.children).reduce((m, c) => Math.max(m, c.offsetLeft + c.offsetWidth), 0), 0);
      h = (dh && dh !== 'auto') ? dh : Math.max(Array.from(e.children).reduce((m, c) => Math.max(m, c.offsetTop + c.offsetHeight), 0), 0);
      // 叶子元素（label/slot 等）按估算尺寸
      if (e.children.length === 0) {
        w = (dw && dw !== 'auto') ? dw : estimateWidth(node, parentW);
        h = (dh && dh !== 'auto') ? dh : estimateHeight(node, parentW, parentH);
      }
    }
  }
  e.style.width = w + 'px';
  e.style.height = h + 'px';
  parentEl.appendChild(e);
  return e;
}


// ================= 主流程 =================
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');
const checkBtn = document.getElementById('checkBtn');
const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const viewport = document.getElementById('viewport');
const mcUi = document.getElementById('mcUi');
const zoom = document.getElementById('zoom');
const zoomVal = document.getElementById('zoomVal');

let selectedText = null, selectedName = null;

// 读取文件内容（autoRender=true 时立即渲染）
function loadFile(file, autoRender) {
  selectedName = file.name;
  fileNameEl.textContent = file.name;
  checkBtn.disabled = false;
  const reader = new FileReader();
  reader.onload = () => {
    selectedText = reader.result;
    if (autoRender) renderCurrent();
  };
  reader.readAsText(file, 'utf-8');
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  if (f) loadFile(f, false);
});

zoom.addEventListener('input', () => {
  zoomVal.textContent = zoom.value + '%';
  mcUi.style.transform = 'scale(' + (zoom.value / 100) + ')';
});

// 渲染当前文件（点击「开始检查」或拖入文件后调用）
function renderCurrent() {
  if (!selectedText) return;
  stage.querySelectorAll('.error-msg').forEach(x => x.remove());
  hint.style.display = 'none';
  viewport.style.display = 'block';
  mcUi.innerHTML = '';
  try {
    const roots = parseHtml(selectedText);
    // 注入用户 <style> 内容（类规则，:hover 等由浏览器原生处理）
    let styleEl = document.getElementById('uc-injected-css');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'uc-injected-css';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = collectStyles(roots).map(forceImportant).join('\n');
    let winNode = null;
    for (const r of roots) { winNode = findFirstDiv(r); if (winNode) break; }
    if (!winNode) throw new Error('未找到窗口 div（<div>）节点');
    const style = parseStyle(winNode.attrs.style);
    const title = winNode.attrs.title || '窗口';

    const win = el('div', 'mc-window');
    const tb = el('div', 'mc-titlebar');
    tb.innerHTML = '<span>' + esc(title) + '</span><span class="mc-dots">\u2014 \u25a1 \u00d7</span>';
    const content = el('div', 'mc-content');
    win.appendChild(tb);
    win.appendChild(content);
    mcUi.appendChild(win);

    const screenW = stage.clientWidth, screenH = stage.clientHeight;
    // 窗口本体 = 第一个 div，布局到内容区（0,0）
    const rootEl = layoutNode(winNode, content, 0, 0, screenW, screenH, true);
    const rw = parseFloat(rootEl.style.width) || 0;
    const rh = parseFloat(rootEl.style.height) || 0;
    content.style.width = rw + 'px';
    content.style.height = rh + 'px';
    win.style.width = rw + 'px';
  } catch (err) {
    viewport.style.display = 'none';
    hint.style.display = 'block';
    hint.innerHTML = '';
    hint.appendChild(el('div', 'error-msg', '解析失败：' + err.message));
  }
}

checkBtn.addEventListener('click', renderCurrent);

// ================= 拖入文件加载 =================
let dragDepth = 0;

document.addEventListener('dragenter', e => {
  e.preventDefault();
  if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
    dragDepth++;
    stage.classList.add('dragging');
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0) {
    dragDepth = 0;
    stage.classList.remove('dragging');
  }
});
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  stage.classList.remove('dragging');
  const files = e.dataTransfer ? e.dataTransfer.files : null;
  if (!files || !files.length) return;
  const f = Array.prototype.find.call(files, x => /\.html?$/i.test(x.name) || x.type === 'text/html');
  if (!f) {
    hint.style.display = 'block';
    hint.innerHTML = '';
    hint.appendChild(el('div', 'error-msg', '请拖入 .html 文件'));
    return;
  }
  loadFile(f, true); // 拖入即加载并渲染
});
</script>
</body>
